<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TaskInsight • Entrar</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="auth-shell">
  <div class="auth-card">
    <h1 class="brand">TaskInsight</h1>
    <p class="brand-sub">Gerencie seu tempo com clareza e calma.</p>
    <form id="login">
      <div class="field"><label>E-mail</label><input name="email" type="email" placeholder="seu@email.com" required></div>
      <div class="field"><label>Senha</label><input name="password" type="password" placeholder="••••••••" required></div>
      <button class="btn" type="submit">Entrar →</button>
      <div id="err" class="error"></div>
      <p class="foot">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
    </form>
  </div>
</main>
<footer class="site">© 2026 TaskInsight. Built for clarity.</footer>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>bindLogin(document.getElementById("login"));</script>
</body>
</html>
