<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TaskInsight • Quadro de Tarefas</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <h1 class="brand">TaskInsight</h1>
    <p style="color:var(--muted);font-size:12px;margin:4px 0 0">Produtividade</p>
    <nav class="nav">
      <a href="app.html" class="active">📋 Quadro de Tarefas</a>
      <a href="http://localhost:8501" target="_blank">📊 Analytics</a>
    </nav>
    <div class="user">
      <div class="avatar" id="ava">U</div>
      <div style="flex:1">
        <div id="uname" style="font-size:13px;font-weight:600"></div>
        <a href="#" id="logout" style="font-size:11px">Sair</a>
      </div>
    </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <h1>Quadro de Tarefas</h1>
      <a class="btn-secondary" href="http://localhost:8501" target="_blank">Abrir Dashboard</a>
    </div>
    <div id="kpis" class="kpis"></div>
    <div id="board" class="board"></div>
  </main>
</div>

<button class="fab" id="fab" title="Nova Tarefa">+</button>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>Nova Tarefa</h2>
    <form id="new-task">
      <div class="field"><label>Título</label><input name="title" required></div>
      <div class="field"><label>Descrição</label><input name="description"></div>
      <div class="row">
        <div class="field"><label>Prioridade</label>
          <select name="priority"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option></select>
        </div>
        <div class="field"><label>Status</label>
          <select name="status">
            <option value="a_fazer">A Fazer</option><option value="em_progresso">Em Progresso</option>
            <option value="em_revisao">Em Revisão</option><option value="concluido">Concluído</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Categoria</label><input name="category" placeholder="Ex: Marketing"></div>
      <div class="row">
        <button type="button" id="cancel" class="btn" style="background:#e5e7eb;color:#111">Cancelar</button>
        <button type="submit" class="btn">Criar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/board.js"></script>
<script>
  requireAuth();
  const u = user();
  if (u) { document.getElementById("uname").textContent = u.name; document.getElementById("ava").textContent = (u.name||"U")[0].toUpperCase(); }
  document.getElementById("logout").onclick = (e)=>{e.preventDefault();logout();};
  bindNewTask();
  loadAll();
</script>
</body>
</html>
